

services:
   redis:
     image: redis:latest
     container_name: cache_redis

   web:
     build: .
     #container_name: web_app
     image: ghcr.io/huynongquoc05/advancedforum-web:latest
     environment:
         - REDIS_HOST=redis
     depends_on:
       - redis


   nginx:
     image: nginx:latest
     container_name: nginx_server
     ports:
       - "8005:80"
     volumes:
       - ./Nginx.conf:/etc/nginx/conf.d/default.conf
     depends_on:
       - web

